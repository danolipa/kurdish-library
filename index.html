<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کتێبخانەی کوردی</title>
  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --quote-bg: #090d16;
      --quote-text: #fde047;
    }

    body.theme-light {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --quote-bg: #f1f5f9;
      --quote-text: #854d0e;
    }

    body.theme-sepia {
      --bg-color: #fbf0d9;
      --card-bg: #f4e4c1;
      --border-color: #e2d2ad;
      --text-main: #4a3b32;
      --text-muted: #786455;
      --accent-color: #b45309;
      --quote-bg: #ebd8b0;
      --quote-text: #92400e;
    }

    body.theme-eink {
      --bg-color: #ffffff;
      --card-bg: #ffffff;
      --border-color: #000000;
      --text-main: #000000;
      --text-muted: #333333;
      --accent-color: #000000;
      --quote-bg: #f0f0f0;
      --quote-text: #000000;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      direction: rtl;
    }

    /* Header */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .theme-buttons {
      display: flex;
      gap: 4px;
      background: var(--bg-color);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .theme-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: bold;
    }

    .theme-btn.active {
      background: var(--accent-color);
      color: #ffffff;
    }

    /* Main Area */
    main {
      flex: 1;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 80px;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 12px;
      border-right: 4px solid var(--accent-color);
      padding-right: 8px;
    }

    .book-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .book-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .book-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .book-card:active {
      transform: scale(0.98);
    }

    .book-tag {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .book-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .book-author {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .book-snippet {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal Reader */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-overlay.active {
      display: block;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      max-width: 650px;
      margin: 0 auto;
    }

    .back-btn {
      background: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
      color: var(--accent-color);
    }

    .modal-author {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-heading {
      font-size: 15px;
      font-weight: bold;
      margin: 16px 0 8px 0;
      color: var(--accent-color);
    }

    .summary-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .quote-box {
      background-color: var(--quote-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .quote-item {
      font-size: 13px;
      color: var(--quote-text);
      line-height: 1.6;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border-color);
    }

    .quote-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .quote-en {
      font-size: 11px;
      color: var(--text-muted);
      direction: ltr;
      text-align: left;
      margin-top: 2px;
    }

    /* Bottom Nav Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 40;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      gap: 2px;
    }

    .nav-item.active {
      color: var(--accent-color);
      font-weight: bold;
    }

    .nav-icon {
      font-size: 18px;
    }
  </style>
</head>
<body class="theme-dark">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">کـ</div>
      <div class="brand-title">کتێبخانەی کوردی</div>
    </div>
    <div class="theme-buttons">
      <button onclick="setTheme('light')" id="btn-light" class="theme-btn">☀️ Light</button>
      <button onclick="setTheme('dark')" id="btn-dark" class="theme-btn active">🌙 Dark</button>
      <button onclick="setTheme('sepia')" id="btn-sepia" class="theme-btn">📜 Sepia</button>
      <button onclick="setTheme('eink')" id="btn-eink" class="theme-btn">📖 E-Ink</button>
    </div>
  </header>

  <!-- Main View -->
  <main id="mainView">
    <!-- Search Box -->
    <div class="search-box">
      <input type="text" id="searchInput" oninput="filterBooks()" placeholder="گەڕان بەدوای کتێب، نووسەر، یان بوار..." class="search-input">
    </div>

    <!-- Home Catalog -->
    <div id="tabHome">
      <div class="section-title">کۆمەڵەی پوختەی کتێبەکان</div>
      <div id="bookGrid" class="book-grid"></div>
    </div>

    <!-- Quotes Tab -->
    <div id="tabQuotes" style="display: none;">
      <div class="section-title">١٠ وتەی دیار و کاریگەر</div>
      <div id="quotesContainer" class="quote-box"></div>
    </div>

    <!-- Settings Tab -->
    <div id="tabSettings" style="display: none;">
      <div class="section-title">ڕێکخستنەکانی بەرنامە</div>
      <div class="book-card" style="margin-bottom: 12px;">
        <div class="book-title">دەربارەی بەرنامە</div>
        <div class="book-snippet">کتێبخانەی کوردی - وەشانی ١.٠.٠<br>ئەپڵیکەیشنی تایبەت بە خوێندنەوەی پوختەی کتێبەکان و وتە بەناوبانگەکان.</div>
      </div>
    </div>
  </main>

  <!-- Modal Reader -->
  <div id="readerModal" class="modal-overlay">
    <div class="modal-content">
      <button onclick="closeModal()" class="back-btn">← بگەڕێوە بۆ کتێبخانە</button>
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalAuthor" class="modal-author"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav>
    <button onclick="showTab('home')" id="navHome" class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>ماڵەوە</span>
    </button>
    <button onclick="showTab('quotes')" id="navQuotes" class="nav-item">
      <span class="nav-icon">💬</span>
      <span>وتەکان</span>
    </button>
    <button onclick="showTab('settings')" id="navSettings" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>ڕێکخستن</span>
    </button>
  </nav>

  <script>
    const books = [
      {
        id: 1,
        tag: "خۆپەرەسەندن",
        title: "ئادەتە بچووکەکان (Atomic Habits)",
        author: "جەیمس کلێر | ساڵی ٢٠١٨",
        snippet: "ڕێگایەکی ئاسان و سەلمێنراو بۆ دروستکردنی ئادەتی باش و تێکشکاندنی ئادەتە خراپەکان...",
        summary: `
          <div class="summary-heading">① پێشەکی کتێب</div>
          <div class="summary-text">ئەم کتێبە جەخت لەسەر هێزی گۆڕانکارییە بچووکەکان دەکاتەوە. گۆڕانکاری ١٪ ڕۆژانە دوای ساڵێک دەتباتە ئاستێکی زۆر بەرزتر.</div>
          <div class="summary-heading">② کێشەی سەرەکی</div>
          <div class="summary-text">خەڵکی زۆرجار هەوڵی گۆڕینی ئامانجەکان دەدەن لە شوێنی گۆڕینی سیستەمی ژیانیان.</div>
          <div class="summary-heading">③ یاساکانی دروستکردنی ئادەت</div>
          <div class="summary-text">
            • یاسای یەکەم: ئادەتەکە ڕوون و دیار بکە (Make it obvious)<br>
            • یاسای دووەم: ئادەتەکە ڕاکێشەر بکە (Make it attractive)<br>
            • یاسای سێیەم: ئادەتەکە ئاسان بکە (Make it easy)<br>
            • یاسای چوارەم: ئادەتەکە چێژبەخش بکە (Make it satisfying)
          </div>
        `,
        quotes: [
          { ckb: "تۆ بەرز نابیتەوە بۆ ئاستی ئامانجەکانت، بەڵکو دادەبەزیت بۆ ئاستی سیستەمەکانت.", en: "You do not rise to the level of your goals. You fall to the level of your systems." },
          { ckb: "گۆڕانکارییە بچووکەکان ئەنجامی گەورە دروست دەکەن.", en: "Changes that seem small and unimportant at first will compound into remarkable results." }
        ]
      },
      {
        id: 2,
        tag: "فەلسەفە & دەروونناسی",
        title: "مرۆڤ لە دوای مانادا دەگەڕێت",
        author: "ڤیکتۆر فرانکڵ | ساڵی ١٩٤٦",
        snippet: "ئەزموونی دەروونپزیشکێک لە سەربازگەکانی مەرگی نازیدا و دۆزینەوەی ئامانجی ژیان...",
        summary: `
          <div class="summary-heading">① تێگەیشتن لە مانا</div>
          <div class="summary-text">ڤیکتۆر فرانکڵ لە ڕێگەی دەروونناسیی لۆگۆتێراپییەوە ڕوونی دەکاتەوە کە مرۆڤ تەنانەت لە سەختترین ئازارەکانیشدا دەتوانێت مانا بدۆزێتەوە.</div>
          <div class="summary-heading">② سەرچاوەکانی مانا</div>
          <div class="summary-text">
            • ڕێگەی یەکەم: لە ڕێگەی کارکردن یان بەدیهێنانی ئامانجێک.<br>
            • ڕێگەی دووەم: لە ڕێگەی ئەزموونکردنی خۆشەویستی.<br>
            • ڕێگەی سێیەم: هەڵوێست و ڕەفتارت بەرامبەر ئازارە نەبڕاوەکان.
          </div>
        `,
        quotes: [
          { ckb: "ئەو کەسەی هۆکارێکی هەیە بۆ ژیان، دەتوانێت بەرگەی هەر چۆنێک بگرێت.", en: "He who has a why to live can bear almost any how." },
          { ckb: "کاتێک ناتوانین بارودۆخێک بگۆڕین، ڕووبەڕووی ئاڵۆنگاری دەبینەوە بۆ گۆڕینی خۆمان.", en: "When we are no longer able to change a situation, we are challenged to change ourselves." }
        ]
      }
    ];

    function renderBooks(bookList) {
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';
      if (bookList.length === 0) {
        grid.innerHTML = '<div style="color: var(--text-muted); padding: 20px 0;">هیچ کتێبێک نەدۆزرایەوە...</div>';
        return;
      }
      bookList.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';
        card.onclick = () => openSummary(book.id);
        card.innerHTML = `
          <span class="book-tag">${book.tag}</span>
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author}</div>
          <div class="book-snippet">${book.snippet}</div>
        `;
        grid.appendChild(card);
      });
    }

    function filterBooks() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = books.filter(b => 
        b.title.toLowerCase().includes(query) || 
        b.author.toLowerCase().includes(query) || 
        b.tag.toLowerCase().includes(query)
      );
      renderBooks(filtered);
    }

    function openSummary(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      document.getElementById('modalTitle').innerText = book.title;
      document.getElementById('modalAuthor').innerText = book.author;

      let quotesHTML = '';
      if (book.quotes && book.quotes.length > 0) {
        quotesHTML = `
          <div class="summary-heading">💬 وتە دیارەکانی ئەم کتێبە</div>
          <div class="quote-box">
            ${book.quotes.map((q, i) => `
              <div class="quote-item">
                <div><b>${i + 1}.</b> "${q.ckb}"</div>
                <div class="quote-en">${q.en}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      document.getElementById('modalBody').innerHTML = book.summary + quotesHTML;
      document.getElementById('readerModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('readerModal').classList.remove('active');
    }

    function setTheme(theme) {
      document.body.className = `theme-${theme}`;
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${theme}`);
      if (activeBtn) activeBtn.classList.add('active');
      localStorage.setItem('kurdish_lib_theme', theme);
    }

    function showTab(tabName) {
      document.getElementById('tabHome').style.display = tabName === 'home' ? 'block' : 'none';
      document.getElementById('tabQuotes').style.display = tabName === 'quotes' ? 'block' : 'none';
      document.getElementById('tabSettings').style.display = tabName === 'settings' ? 'block' : 'none';

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tabName === 'home') {
        document.getElementById('navHome').classList.add('active');
      } else if (tabName === 'quotes') {
        document.getElementById('navQuotes').classList.add('active');
        renderAllQuotes();
      } else if (tabName === 'settings') {
        document.getElementById('navSettings').classList.add('active');
      }
    }

    function renderAllQuotes() {
      const container = document.getElementById('quotesContainer');
      let count = 1;
      let html = '';
      books.forEach(b => {
        if (b.quotes) {
          b.quotes.forEach(q => {
            html += `
              <div class="quote-item">
                <div><b>${count++}.</b> "${q.ckb}"</div>
                <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">— کتێبی: ${b.title}</div>
                <div class="quote-en">${q.en}</div>
              </div>
            `;
          });
        }
      });
      container.innerHTML = html || 'هیچ وتەیەک نەدۆزرایەوە.';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('kurdish_lib_theme') || 'dark';
      setTheme(savedTheme);
      renderBooks(books);
    });
  </script>
</body>
</html>
